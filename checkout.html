<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Majorleague — Checkout</title><link rel="stylesheet" href="styles.css?v=0a9504e"></head><body><header class="header"><a class="logo" href="index.html"><img src="assets/majorleague-logo.webp" alt="Majorleague"></a><a class="basket" href="index.html">SHOP</a></header><main class="checkout-page"><a class="back" href="index.html">← BACK TO SHOP</a><div class="heading"><span>MAJORLEAGUE</span><h1>CHECKOUT</h1></div><div class="checkout-grid"><section class="card"><h2>YOUR DETAILS</h2><form id="form"><label>FULL NAME<input required name="name"></label><label>EMAIL<input required type="email" name="email"></label><label>PHONE<input required name="phone"></label><label>ADDRESS<textarea required name="address" rows="4"></textarea></label><h2>PAYMENT</h2><label class="pay"><input required type="radio" name="payment" value="cod"><span><b>Cash on delivery</b><small>Pay when your lawful order is delivered.</small></span></label><label class="pay"><input type="radio" name="payment" value="bank"><span><b>Bank transfer</b><small>Instructions can be supplied by your fulfilment system.</small></span></label><button class="submit">SUBMIT ORDER REQUEST</button><p class="note">Front-end checkout template. Connect the form to your lawful fulfilment/order system before taking real orders.</p></form></section><aside class="card"><h2>ORDER SUMMARY</h2><div id="summary"></div><div class="summary-total"><span>TOTAL</span><b id="total">£0.00</b></div></aside></div></main><script src="stock.js"></script><script>const b=JSON.parse(localStorage.getItem("ml-vault-basket")||"[]"),s=document.querySelector("#summary"),t=document.querySelector("#total");let n=0;s.innerHTML=b.map(x=>{const p=STORE.products.find(y=>y.id===x.id);n+=p.price*x.qty;return '<div class="summary-row"><span>'+p.name+' × '+x.qty+'</span><b>'+STORE.currency+(p.price*x.qty).toFixed(2)+'</b></div>'}).join("")||'<div class="empty">YOUR BASKET IS EMPTY.</div>';t.textContent=STORE.currency+n.toFixed(2);document.querySelector("#form").onsubmit=e=>{e.preventDefault();alert("Order request submitted in demo mode.")}</script></body></html>
