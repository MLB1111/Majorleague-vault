name: Deploy Majorleague
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Version local assets for this deployment
        env:
          BUILD_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          version = os.environ["BUILD_VERSION"]
          # Version every local stylesheet, script, and image URL in the
          # published copy. Each deployment gets fresh URLs, so browsers
          # cannot reuse cached copies of old assets under the same URL.
          targets = {".html", ".css", ".js"}
          asset = re.compile(r"((?:styles\.css|app\.js|stock\.js|assets/[A-Za-z0-9_./-]+))(?:\?v=[^\s\"' )<>]*)?")
          for path in Path(".").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in targets:
                  continue
              if ".git" in path.parts or path.parts[0] == ".github":
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = asset.sub(lambda m: m.group(1) + "?v=" + version, text)
              # Tell compliant browsers not to store the document for reuse.
              if path.suffix.lower() == ".html" and "<head>" in updated.lower() and "http-equiv=\"cache-control\"" not in updated.lower():
                  updated = re.sub(r"(<head[^>]*>)", r'\1<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">', updated, count=1, flags=re.I)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          print("Versioned local assets with deployment SHA:", version)
          PY

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
